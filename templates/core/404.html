{% extends 'base.html' %}
{% load gzp %}
{% block title %}{% t "Not found" %}{% endblock %}
{% block content %}
<div class="card mx-auto mt-5" style="max-width:620px">
  <div class="card-body text-center p-5">
    <div class="display-4 mb-2"><i class="bi bi-compass"></i></div>
    <h1 class="h3">Page not found (404)</h1>
    <p class="sub">The address may be wrong, or the record may have been removed. Try the public portal or your
      dashboard.</p>
    <div class="d-flex gap-2 justify-content-center mt-3">
      <a class="btn btn-primary" href="/app/">Dashboard</a>
      <a class="btn btn-outline-secondary" href="/">Public home</a>
    </div>
  </div>
</div>
{% endblock %}
