{% extends 'base.html' %}
{% load gzp %}
{% block title %}Server error{% endblock %}
{% block content %}
<div class="card mx-auto mt-5" style="max-width:620px">
  <div class="card-body text-center p-5">
    <div class="display-4 mb-2"><i class="bi bi-cone-striped"></i></div>
    <h1 class="h3">Something went wrong (500)</h1>
    <p class="sub">The server could not complete the request. The event is recorded on the system health page for
      the administrator.</p>
    <div class="d-flex gap-2 justify-content-center mt-3">
      <a class="btn btn-primary" href="/app/">Dashboard</a>
      <a class="btn btn-outline-secondary" href="/app/health/">System health</a>
    </div>
  </div>
</div>
{% endblock %}
